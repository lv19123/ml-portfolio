[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-recommender"
version = "0.1.0"
requires-python = ">=3.10,<3.13"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fashion_recommender*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
